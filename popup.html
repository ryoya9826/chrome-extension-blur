<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #333;
    }

    h3,
    h4 {
      margin: 0 0 10px 0;
    }

    h4 {
      font-size: 14px;
      color: #666;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h4 .count {
      font-size: 11px;
      color: #007bff;
      font-weight: normal;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    input[type="checkbox"] {
      margin-right: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #007bff;
      color: white;
      padding: 8px 12px;
      width: 100%;
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    .btn-add {
      background: #28a745;
      color: white;
      padding: 6px 12px;
      width: 100%;
    }

    .btn-add:hover {
      background: #218838;
    }

    .list-item {
      font-size: 12px;
      border-bottom: 1px solid #eee;
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item .remove-btn {
      color: #dc3545;
      cursor: pointer;
      font-weight: bold;
      margin-left: 10px;
    }

    .input-error {
      display: none;
      color: #dc3545;
      font-size: 11px;
      margin: -4px 0 8px 0;
    }

    .shortcut-hint {
      margin-top: 6px;
      font-size: 11px;
      color: #6c757d;
      text-align: center;
    }

    .shortcut-hint kbd {
      background: #f1f3f5;
      border: 1px solid #ced4da;
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 10px;
      color: #495057;
    }

    .shortcut-hint a {
      margin-left: 6px;
      color: #007bff;
      text-decoration: none;
      font-size: 10px;
    }

    .shortcut-hint a:hover {
      text-decoration: underline;
    }

    .sub-option {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }

    #analysisList {
      font-size: 11px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      max-height: 150px;
      overflow-y: auto;
    }

    .analysis-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
    }

    .analysis-item code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 3px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-item button {
      background: #17a2b8;
      color: white;
      padding: 2px 8px;
      font-size: 10px;
      flex-shrink: 0;
    }

    .analysis-item button:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h3>Blur Focus</h3>

  <div class="control-group">
    <label>
      <input type="checkbox" id="masterToggle"> <span data-i18n="enableBlur">Enable Blur</span>
    </label>
    <label class="sub-option" data-i18n-title="revealOnHoverHint" title="Turn off when screen sharing so blurred content is never revealed by accident.">
      <input type="checkbox" id="hoverRevealToggle"> <span data-i18n="revealOnHover">Reveal on hover</span>
    </label>
  </div>

  <hr>

  <div class="control-group">
    <button id="selectModeBtn" class="btn-primary" data-i18n="selectElement">🖱️ Select Element on Page</button>
    <!-- 中身は popup.js の renderShortcut が現在のショートカット設定から描画する -->
    <div id="shortcutHint" class="shortcut-hint"></div>
  </div>

  <h4 data-i18n="manualAdd">Manual Add</h4>
  <input type="text" id="targetSelector" data-i18n-placeholder="selectorPlaceholder" placeholder="e.g. .ads, #sidebar">
  <div id="inputError" class="input-error"></div>
  <button id="addBtn" class="btn-add" data-i18n="addSelector">Add Selector</button>

  <h4>
    <span data-i18n="activeFilters">Active Filters</span>
    <span id="filterCount" class="count"></span>
  </h4>
  <div id="listContainer"></div>
  <button id="resetDomainBtn"
    style="background:#dc3545; color:white; font-size:10px; padding:4px 8px; margin-top:5px; width:100%;"
    data-i18n="resetDomain">Reset for this Domain</button>

  <div id="analysisSection">
    <h4 data-i18n="candidates">Auto-Analysis Candidates</h4>
    <div id="analysisList" data-i18n="scanning">Scanning page...</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
